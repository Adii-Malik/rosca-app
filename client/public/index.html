<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Committee</title>
    <meta
      name="description"
      content="Track committee contributions, run the monthly draw, and keep a record of every round."
    />

    <!-- SVG stays sharp at 16px where a downscaled PNG goes soft; the PNG is the
         fallback for anything that will not take an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />

    <!-- iOS uses this one for the home screen, and only this one. It is opaque
         and square on purpose: iOS composites transparency onto black and then
         applies its own rounded mask, so an icon with its own rounded corners
         shows black wedges outside them. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#1f47d6" />

    <!-- Added to the home screen it opens without browser chrome: Android reads
         the manifest, iOS reads these. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Committee" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
